<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
  <!-- Dorso delle carte Weiss Schwarz disegnato da VinylDex (nessun logo ufficiale). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f5" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#111111"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="750" height="1050" rx="40"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="750" height="1050" fill="#111111"/>
    <rect width="750" height="1050" fill="url(#bg)"/>
    <rect x="375" y="0" width="375" height="1050" fill="#f5f5f5"/>
    <circle cx="375" cy="500" r="200" fill="#111111" stroke="#e5c07b" stroke-width="10"/>
    <path d="M375 300 A100 100 0 0 1 375 500 A100 100 0 0 0 375 700 A200 200 0 0 1 375 300 Z" fill="#f5f5f5"/>
    <circle cx="375" cy="400" r="30" fill="#111111"/><circle cx="375" cy="600" r="30" fill="#f5f5f5"/>
    <text x="375" y="905" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="64" letter-spacing="6" fill="#111111" stroke="#e5c07b" stroke-width="2">WEISS SCHWARZ</text>
    <rect x="22" y="22" width="706" height="1006" rx="26" fill="none" stroke="#e5c07b" stroke-width="10"/>
  </g>
</svg>
