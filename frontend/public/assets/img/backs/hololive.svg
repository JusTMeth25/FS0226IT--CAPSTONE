    <text x="375" y="905" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="64" letter-spacing="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2">LIVE STAGE</text>
    <rect x="22" y="22" width="706" height="1006" rx="26" fill="none" stroke="#38bdf8" stroke-width="10"/>
