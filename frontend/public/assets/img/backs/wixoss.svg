<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
  <!-- Dorso delle carte WIXOSS disegnato da VinylDex (nessun logo ufficiale). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9a8d4" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#2a0a3d"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="750" height="1050" rx="40"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="750" height="1050" fill="#2a0a3d"/>
    <rect width="750" height="1050" fill="url(#bg)"/>
    <g fill="none" stroke="#f472b6" stroke-width="10">
      <polygon points="375,260 560,500 375,740 190,500"/><polygon points="375,340 490,500 375,660 260,500"/></g>
    <g fill="#f472b6" opacity="0.8"><circle cx="375" cy="500" r="30"/>
      <path d="M375 200 C340 150 300 170 310 210 C320 240 375 250 375 250 C375 250 430 240 440 210 C450 170 410 150 375 200 Z"/></g>
    <text x="375" y="905" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="64" letter-spacing="6" fill="#fce7f3" stroke="#f472b6" stroke-width="2">DIVA</text>
    <rect x="22" y="22" width="706" height="1006" rx="26" fill="none" stroke="#f472b6" stroke-width="10"/>
  </g>
</svg>
