<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
  <!-- Dorso delle carte Cardfight!! Vanguard disegnato da VinylDex (nessun logo ufficiale). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#0f1d3d"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="750" height="1050" rx="40"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="750" height="1050" fill="#0f1d3d"/>
    <rect width="750" height="1050" fill="url(#bg)"/>
    <path d="M375 250 L560 320 L540 560 Q520 690 375 780 Q230 690 210 560 L190 320 Z" fill="none" stroke="#fbbf24" stroke-width="14"/>
    <path d="M375 330 L470 370 L460 540 Q450 620 375 670 Q300 620 290 540 L280 370 Z" fill="#fbbf24" opacity="0.8"/>
    <path d="M300 460 L375 520 L450 460" fill="none" stroke="#0f1d3d" stroke-width="14"/>
    <text x="375" y="905" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="64" letter-spacing="6" fill="#dbeafe" stroke="#fbbf24" stroke-width="2">VANGUARD</text>
    <rect x="22" y="22" width="706" height="1006" rx="26" fill="none" stroke="#fbbf24" stroke-width="10"/>
  </g>
</svg>
