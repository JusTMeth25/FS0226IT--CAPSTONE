<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
  <!-- Dorso delle carte NBA disegnato da VinylDex (nessun logo ufficiale): parquet, linee del
       campo e un pallone al centro, nei colori blu e rosso. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d428a"/>
      <stop offset="0.6" stop-color="#0b1e3f"/>
      <stop offset="1" stop-color="#050b18"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.6" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </radialGradient>
    <pattern id="wood" width="60" height="1050" patternUnits="userSpaceOnUse">
      <rect width="30" height="1050" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="750" height="1050" rx="40"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="750" height="1050" fill="url(#bg)"/>
    <rect width="750" height="1050" fill="url(#wood)"/>
    <g fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8">
      <rect x="60" y="60" width="630" height="930"/>
      <line x1="60" y1="525" x2="690" y2="525"/>
      <circle cx="375" cy="525" r="150"/>
      <rect x="245" y="60" width="260" height="280"/>
      <rect x="245" y="710" width="260" height="280"/>
      <path d="M95 60 L95 200 A280 280 0 0 0 655 200 L655 60"/>
      <path d="M95 990 L95 850 A280 280 0 0 1 655 850 L655 990"/>
    </g>
    <rect x="0" y="470" width="750" height="110" fill="#c8102e" fill-opacity="0.85"/>
    <circle cx="375" cy="525" r="120" fill="url(#ball)" stroke="#111827" stroke-width="6"/>
    <g fill="none" stroke="#111827" stroke-width="6">
      <line x1="255" y1="525" x2="495" y2="525"/>
      <line x1="375" y1="405" x2="375" y2="645"/>
      <path d="M290 440 C340 490 340 560 290 610"/>
      <path d="M460 440 C410 490 410 560 460 610"/>
    </g>
    <text x="375" y="930" font-family="Arial Black, Arial" font-size="54" fill="#ffffff" fill-opacity="0.9" text-anchor="middle" letter-spacing="8">VINYLDEX</text>
    <text x="375" y="170" font-family="Arial" font-weight="bold" font-size="34" fill="#ffffff" fill-opacity="0.75" text-anchor="middle" letter-spacing="14">HOOPS</text>
  </g>
  <rect x="6" y="6" width="738" height="1038" rx="36" fill="none" stroke="#c8102e" stroke-width="12"/>
</svg>
