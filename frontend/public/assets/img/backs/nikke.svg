<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
  <!-- Dorso delle carte GODDESS OF VICTORY: NIKKE disegnato da VinylDex (nessun logo ufficiale):
       superficie in guerra, mirino rosso al centro e fasce da equipaggiamento militare. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2a"/>
      <stop offset="0.55" stop-color="#0c0f16"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="0.5" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 L0 0 0 50" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
    <pattern id="hazard" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#f59e0b"/>
      <rect x="20" width="20" height="40" fill="#111827"/>
    </pattern>
    <clipPath id="card"><rect x="0" y="0" width="750" height="1050" rx="40"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="750" height="1050" fill="url(#bg)"/>
    <rect width="750" height="1050" fill="url(#grid)"/>
    <rect width="750" height="1050" fill="url(#glow)"/>
    <!-- Fasce di pericolo in alto e in basso -->
    <rect x="0" y="60" width="750" height="34" fill="url(#hazard)" opacity="0.85"/>
    <rect x="0" y="956" width="750" height="34" fill="url(#hazard)" opacity="0.85"/>
    <!-- Mirino -->
    <g fill="none" stroke="url(#red)" stroke-linecap="round">
      <circle cx="375" cy="480" r="210" stroke-width="10"/>
      <circle cx="375" cy="480" r="150" stroke-width="4" stroke-dasharray="18 14"/>
      <circle cx="375" cy="480" r="46" stroke-width="10"/>
      <path d="M375 230 V330 M375 630 V730 M125 480 H225 M525 480 H625" stroke-width="12"/>
    </g>
    <circle cx="375" cy="480" r="10" fill="#fecdd3"/>
    <!-- Ali della vittoria stilizzate -->
    <g fill="url(#red)" opacity="0.9">
      <path d="M318 470 L170 400 L205 440 L150 432 L196 468 L150 478 L210 492 Z"/>
      <path d="M432 470 L580 400 L545 440 L600 432 L554 468 L600 478 L540 492 Z"/>
    </g>
    <text x="375" y="815" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="92" letter-spacing="10" fill="#f8fafc">NIKKE</text>
    <text x="375" y="862" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="30" letter-spacing="8" fill="#fda4af">GODDESS OF VICTORY</text>
    <rect x="22" y="22" width="706" height="1006" rx="26" fill="none" stroke="url(#red)" stroke-width="10"/>
  </g>
</svg>
