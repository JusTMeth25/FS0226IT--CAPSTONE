<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
  <!-- Dorso delle carte Union Arena (anime) disegnato da VinylDex (nessun logo ufficiale). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="750" height="1050" rx="40"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="750" height="1050" fill="#1c1917"/>
    <rect width="750" height="1050" fill="url(#bg)"/>
    <g stroke="#f97316" stroke-opacity="0.35" stroke-width="18">
      <path d="M375 525 L375 120"/><path d="M375 525 L660 240"/><path d="M375 525 L700 525"/><path d="M375 525 L660 810"/>
      <path d="M375 525 L375 930"/><path d="M375 525 L90 810"/><path d="M375 525 L50 525"/><path d="M375 525 L90 240"/></g>
    <circle cx="375" cy="525" r="150" fill="none" stroke="#f97316" stroke-width="16"/>
    <circle cx="375" cy="525" r="90" fill="#f97316" opacity="0.85"/>
    <text x="375" y="905" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="64" letter-spacing="6" fill="#ffedd5" stroke="#f97316" stroke-width="2">UNION ARENA</text>
    <rect x="22" y="22" width="706" height="1006" rx="26" fill="none" stroke="#f97316" stroke-width="10"/>
  </g>
</svg>
