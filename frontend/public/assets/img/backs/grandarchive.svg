    <text x="375" y="905" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="64" letter-spacing="6" fill="#ccfbf1" stroke="#d4af37" stroke-width="2">ARCHIVE</text>
    <rect x="22" y="22" width="706" height="1006" rx="26" fill="none" stroke="#d4af37" stroke-width="10"/>
  </g>
