      <stop offset="0" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="0.35" stop-color="#0f2f2d"/>
      <stop offset="1" stop-color="#134e4a"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="750" height="1050" rx="40"/></clipPath>
