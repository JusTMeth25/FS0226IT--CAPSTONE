    </g>
  </g>
  <!-- Pallone -->
  <g transform="translate(541 610)">
    <circle r="190" fill="#f8fafc" stroke="#0b0b0b" stroke-width="10"/>
    <polygon points="0,-72 68,-22 42,58 -42,58 -68,-22" fill="#0b0b0b"/>
    <g stroke="#0b0b0b" stroke-width="10">
