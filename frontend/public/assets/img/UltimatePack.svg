  <!-- Scritte -->
  <text x="541" y="960" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="120" fill="url(#gold)" letter-spacing="6">ULTIMATE</text>
  <text x="541" y="1080" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="120" fill="url(#gold)" letter-spacing="6">TEAM</text>
  <text x="541" y="1180" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="54" fill="#dcfce7" letter-spacing="14">EA FC 27 · VINYLDEX</text>
  <text x="541" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="48" fill="#fbe68a" letter-spacing="10">6 CARTE · ICONE</text>
  <rect x="60" y="40" width="963" height="1372" rx="40" fill="none" stroke="url(#gold)" stroke-width="18"/>
