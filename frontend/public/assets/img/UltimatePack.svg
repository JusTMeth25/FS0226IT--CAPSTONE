      <line x1="68" y1="-22" x2="176" y2="-58"/>
      <line x1="42" y1="58" x2="110" y2="152"/>
      <line x1="-42" y1="58" x2="-110" y2="152"/>
      <line x1="-68" y1="-22" x2="-176" y2="-58"/>
    </g>
