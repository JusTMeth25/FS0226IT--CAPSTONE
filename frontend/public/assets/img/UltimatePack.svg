<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1083 1452" width="1083" height="1452">
  <defs>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f5132"/>
      <stop offset="0.45" stop-color="#15803d"/>
      <stop offset="1" stop-color="#052e1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f6c12"/>
      <stop offset="0.5" stop-color="#fbe68a"/>
      <stop offset="1" stop-color="#8f6c12"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pack"><rect x="60" y="40" width="963" height="1372" rx="40"/></clipPath>
  </defs>
  <rect width="1083" height="1452" fill="#06140c"/>
  <rect x="60" y="40" width="963" height="1372" rx="40" fill="url(#foil)"/>
  <g clip-path="url(#pack)">
    <!-- Campo da calcio stilizzato sullo sfondo -->
    <g stroke="#bbf7d0" stroke-opacity="0.18" stroke-width="10" fill="none">
      <rect x="160" y="260" width="763" height="1000"/>
      <line x1="160" y1="760" x2="923" y2="760"/>
      <circle cx="541" cy="760" r="140"/>
      <rect x="360" y="260" width="363" height="170"/>
