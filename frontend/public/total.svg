      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0.65
                0 1 0 0 0.20
                0 0 1 0 1.00
                0 0 0 1 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
