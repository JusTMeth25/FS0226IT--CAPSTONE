<!DOCTYPE html>
<!--/*
  Cornice comune delle email di VinylDex, stile "Phantom" (Persona 5) come il sito: fondo nero notte,
  fascia magenta col filo nero, titolo a ritaglio, pannello con il bordo magenta a sinistra.
  Solo tabelle e stili in linea: Gmail, Outlook e Apple Mail ignorano <style>, flex, grid e clip-path.
  Uso: <html th:replace="~{mail/layout.html :: page(~{::preheader}, ~{::content})}"> nel modello dell'email.
*/-->
<html lang="it" xmlns:th="http://www.thymeleaf.org" th:fragment="page(preheader, content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="supported-color-schemes" content="dark light">
  <title th:text="${subject}">VinylDex</title>
</head>
<body style="margin:0; padding:0; background-color:#07040f; -webkit-text-size-adjust:100%;">
  <!-- Anteprima mostrata accanto all'oggetto nella lista della posta. -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:#07040f;" th:replace="${preheader}"></div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#07040f" style="background-color:#07040f;">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:560px;">

          <!-- Testata: fascia magenta con il logo e il nome in corsivo nero/bianco. -->
          <tr>
            <td bgcolor="#ec4899" style="background-color:#ec4899; padding:14px 22px; border-bottom:6px solid #000000;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="padding-right:12px;">
                    <img th:src="${appUrl + '/icon-192.png'}" src="https://vinyldex.duckdns.org/icon-192.png" width="44" height="44" alt=""
                         style="display:block; width:44px; height:44px; border:3px solid #000000;">
                  </td>
                  <td style="font-family:'Arial Black', Impact, 'Helvetica Neue', Arial, sans-serif; font-size:28px; line-height:30px; font-weight:900; font-style:italic; letter-spacing:1px; color:#ffffff; text-shadow:3px 3px 0 #000000;">
                    VINYLDEX
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Scheggia: tre strisce che ricordano le diagonali del sito. -->
          <tr>
            <td style="font-size:0; line-height:0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td width="62%" height="8" bgcolor="#07040f" style="background-color:#07040f; font-size:0; line-height:0;">&nbsp;</td>
                  <td width="6%" height="8" bgcolor="#ffffff" style="background-color:#ffffff; font-size:0; line-height:0;">&nbsp;</td>
                  <td width="32%" height="8" bgcolor="#b0136a" style="background-color:#b0136a; font-size:0; line-height:0;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Titolo a ritaglio: una lettera per tassello, come i titoli delle pagine. -->
          <tr>
            <td bgcolor="#0d0820" style="background-color:#0d0820; padding:30px 24px 10px;">
              <span th:each="word : ${ransom}" style="display:inline-block; white-space:nowrap; margin:0 10px 6px 0;"><span
                    th:each="l : ${word}"
                    th:style="|display:inline-block; margin:0 2px 0 0; padding:2px 6px; border:2px solid #000000; background-color:${l.background()}; color:${l.color()}; font-family:'Arial Black', Impact, Arial, sans-serif; font-size:22px; line-height:26px; font-weight:900;|"
                    th:text="${l.ch()}">A</span></span>
            </td>
          </tr>

          <!-- Contenuto dell'email, nel pannello col bordo magenta. -->
          <tr>
            <td bgcolor="#0d0820" style="background-color:#0d0820; border-left:6px solid #ec4899; padding:12px 28px 30px 22px; font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size:16px; line-height:26px; color:#f4f1fa;">
              <div th:replace="${content}"></div>
            </td>
          </tr>

          <!-- Piede: sito, motivo dell'email e nota legale. -->
          <tr>
            <td bgcolor="#000000" style="background-color:#000000; border-top:3px solid #ec4899; padding:18px 24px; font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size:12px; line-height:19px; color:#a39fb8;">
              <a th:href="${appUrl}" href="https://vinyldex.duckdns.org"
                 style="color:#ffffff; font-family:'Arial Black', Arial, sans-serif; font-weight:900; text-decoration:none; letter-spacing:1px;">VINYLDEX</a>
              &nbsp;·&nbsp; Colleziona. Scambia. Domina la classifica.<br>
              Hai ricevuto questa email perché è collegata a un account VinylDex: è un messaggio di servizio, non pubblicità.<br>
              <span th:text="|© ${year} VinylDex · progetto didattico non ufficiale.|">© VinylDex · progetto didattico non ufficiale.</span>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
