spring.application.name=vinyldex

# Carica BE/.env se presente, cosi' i segreti non devono essere passati a mano a ogni avvio.
# "optional:" tiene l'avvio possibile anche senza il file, per esempio in produzione dove
# le variabili arrivano dall'ambiente.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Database - Postgres locale creato con pgAdmin (nome: FS0226IT-CAPSTONE).
# Le credenziali arrivano da variabili d'ambiente: non committare mai password.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/FS0226IT-CAPSTONE}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Lo schema e' gestito da Flyway: Hibernate valida soltanto, non genera DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${PORT:4000}
server.error.include-message=never
server.error.include-stacktrace=never

# ---------------------------------------------------------------------------
# JWT - stesso segreto e stessa durata del backend Node, cosi' i token gia'
# emessi restano validi durante il passaggio.
# ---------------------------------------------------------------------------
vinyldex.jwt.secret=${JWT_SECRET:changeme}
vinyldex.jwt.expiration=${JWT_EXPIRES_IN:7d}

# ---------------------------------------------------------------------------
# CORS - origini del frontend Vite
# ---------------------------------------------------------------------------
vinyldex.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}

# ---------------------------------------------------------------------------
# Rate limit globale (equivalente a express-rate-limit: 200 richieste / 60s)
# ---------------------------------------------------------------------------
vinyldex.rate-limit.enabled=true
vinyldex.rate-limit.requests=200
vinyldex.rate-limit.window-seconds=60

# ---------------------------------------------------------------------------
# Chiavi per gli importer di carte esterne (facoltative)
# ---------------------------------------------------------------------------
vinyldex.import.pokemon-api-key=${POKEMONTCG_API_KEY:}
vinyldex.import.apitcg-api-key=${APITCG_API_KEY:}
vinyldex.openai.api-key=${OPENAI_API_KEY:}
vinyldex.openai.model=${OPENAI_MODEL:gpt-4o-mini}

logging.level.com.capstone.vinyldex=INFO
