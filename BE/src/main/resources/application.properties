spring.application.name=vinyldex

# Carica BE/.env se presente, cosi' i segreti non devono essere passati a mano a ogni avvio.
# "optional:" tiene l'avvio possibile anche senza il file, per esempio in produzione dove
# le variabili arrivano dall'ambiente.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Database - PostgreSQL (in locale: createdb -U postgres -E UTF8 vinyldex).
# Le credenziali arrivano da variabili d'ambiente: non committare mai password.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vinyldex}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Lo schema e' gestito da Flyway: Hibernate valida soltanto, non genera DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=${PORT:4000}
server.error.include-message=never
server.error.include-stacktrace=never

# ---------------------------------------------------------------------------
# Documentazione delle API (springdoc): pagina Swagger UI in /api/docs e descrizione
# OpenAPI in /api/docs/openapi.json. Stanno sotto /api perche' Caddy in produzione
# inoltra al backend solo /api/*, /ws/* e /health. Pubbliche: vedi SecurityConfig.
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/api/docs/openapi.json
springdoc.swagger-ui.path=/api/docs
# Aree e operazioni in ordine alfabetico, raggruppate per tag.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.writer-with-order-by-keys=true
# "Try it out" gia' attivo e il token inserito in "Authorize" resta dopo un ricaricamento.
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true

# ---------------------------------------------------------------------------
# JWT - segreto (almeno 32 byte) e durata dei token. Cambiare il segreto
# invalida tutti i token gia' emessi.
# ---------------------------------------------------------------------------
vinyldex.jwt.secret=${JWT_SECRET:changeme}
vinyldex.jwt.expiration=${JWT_EXPIRES_IN:7d}

# ---------------------------------------------------------------------------
# CORS - origini del frontend Vite
# ---------------------------------------------------------------------------
vinyldex.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}

# ---------------------------------------------------------------------------
# Rate limit per IP (RateLimitFilter): richieste ogni 60 secondi
# ---------------------------------------------------------------------------
vinyldex.rate-limit.enabled=true
vinyldex.rate-limit.requests=600
# Le immagini delle carte (raccoglitore 3D, hotel) hanno un contatore a parte: vedi RateLimitFilter.
vinyldex.rate-limit.image-requests=3000
vinyldex.rate-limit.window-seconds=60

# ---------------------------------------------------------------------------
# Chiavi per gli importer di carte esterne (facoltative)
# ---------------------------------------------------------------------------
vinyldex.import.pokemon-api-key=${POKEMONTCG_API_KEY:}
vinyldex.import.apitcg-api-key=${APITCG_API_KEY:}
vinyldex.openai.api-key=${OPENAI_API_KEY:}
vinyldex.openai.model=${OPENAI_MODEL:gpt-4o-mini}

logging.level.com.capstone.vinyldex=INFO

# NPC dell'hotel con un modello linguistico gratuito via OpenRouter (facoltativo: senza chiave
# gli NPC usano le battute a parole chiave). Solo modelli ":free", al massimo tre in catena.
vinyldex.npc.ai.api-key=${OPENROUTER_API_KEY:}

# Carte EA FC 27 Ultimate Team da FutDB (facoltativo: senza chiave si usa l'elenco fisso del progetto).
# La chiave gratuita si crea su https://futdb.app
vinyldex.futdb.api-key=${FUTDB_API_KEY:}
vinyldex.futdb.api-url=${FUTDB_API_URL:https://futdb.app/api}
vinyldex.npc.ai.models=nvidia/nemotron-3-super-120b-a12b:free,poolside/laguna-s-2.1:free,google/gemma-4-31b-it:free
vinyldex.npc.ai.daily-limit=45
vinyldex.npc.ai.per-minute-limit=12

# Edicola dell'hotel: ogni quante ore cambiano le carte esposte in vetrina.
vinyldex.newsstand.rotate-hours=${NEWSSTAND_ROTATE_HOURS:4}

# Accesso con Google e Apple: senza client id il pulsante non compare. Nessuno di questi e' un segreto.
vinyldex.auth.google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}
vinyldex.auth.google.ios-client-id=${GOOGLE_IOS_CLIENT_ID:}
vinyldex.auth.apple.service-id=${APPLE_SERVICE_ID:}
vinyldex.auth.apple.bundle-id=${APPLE_BUNDLE_ID:com.vinyldex.app}
vinyldex.auth.apple.ios-enabled=${APPLE_IOS_ENABLED:false}
vinyldex.auth.apple.redirect-url=${APPLE_REDIRECT_URL:}

# Email (reset della password) via SMTP di Brevo: smtp-relay.brevo.com, porta 587, login e chiave
# SMTP da Brevo > SMTP & API. Senza MAIL_HOST non parte nessuna email: il link si scrive nel log.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
vinyldex.mail.from=${MAIL_FROM:}
vinyldex.mail.from-name=${MAIL_FROM_NAME:VinylDex}
# Indirizzo del frontend per i link nelle email (HashRouter: /#/reset-password?token=...).
vinyldex.app.url=${APP_URL:http://localhost:5173}
# Minuti di validita' del link per reimpostare la password.
vinyldex.password-reset.minutes=${PASSWORD_RESET_MINUTES:30}

# Verifica in due passaggi: giorni di fiducia di un dispositivo (si rinnovano a ogni accesso).
vinyldex.two-factor.trust-days=${TWO_FACTOR_TRUST_DAYS:30}
vinyldex.two-factor.key=${TWO_FACTOR_KEY:${vinyldex.jwt.secret}}
