<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>VinylDex — Home</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/Favicon-vynil.png">
    <link rel="stylesheet" href="assets/css/style.css" />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
  </head>
  <body>
    <div class="app-shell">
      <!-- Overlay mobile per chiudere la sidebar cliccando fuori -->
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <aside class="sidebar" id="app-sidebar">
        <div class="sidebar-brand">
          <a href="#home" id="logo" data-route="home" class="nav-link">VinylDex</a>
        </div>

        <div class="sidebar-user">
          <div class="sidebar-avatar"><i class="ph-fill ph-vinyl-record"></i></div>
          <div class="sidebar-user-info">
            <span class="sidebar-username" id="sidebar-username">Ospite</span>
            <span class="sidebar-level" id="sidebar-level">Livello 1</span>
          </div>
        </div>

        <div class="sidebar-xp">
          <div class="progress-bar sidebar-xp-bar">
            <div class="progress-fill" id="sidebar-xp-fill" style="width: 0%"></div>
          </div>
          <span class="sidebar-xp-text" id="sidebar-xp-text">0 / 100 XP</span>
        </div>

        <nav class="sidebar-nav" aria-label="Main navigation">
          <ul>
            <li><a href="#home" data-route="home" class="nav-link active"><i class="ph-fill ph-house"></i> Home</a></li>
            <li><a href="#packs" data-route="packs" class="nav-link"><i class="ph-fill ph-gift"></i> Apri pacchetti</a></li>
            <li><a href="#collection" data-route="collection" class="nav-link"><i class="ph-fill ph-cards"></i> Collezione</a></li>
            <li><a href="#vinyl-dex" data-route="vinyl-dex" class="nav-link"><i class="ph-fill ph-book-open"></i> VinylDex</a></li>
            <li><a href="#missions" data-route="missions" class="nav-link"><i class="ph-fill ph-target"></i> Missioni</a></li>
            <li><a href="#battle" data-route="battle" class="nav-link"><i class="ph-fill ph-sword"></i> Battaglie</a></li>
          </ul>
        </nav>

        <div class="sidebar-footer">
          <span class="sidebar-gold-pill"><i class="ph-fill ph-coin"></i> <span id="sidebar-gold">0</span></span>
        </div>
      </aside>

      <div class="app-content">
        <header class="topbar" id="app-header">
          <div class="header-inner">
            <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu">
              <span></span>
              <span></span>
              <span></span>
            </button>
            <a href="#home" data-route="home" class="nav-link topbar-brand">VinylDex</a>
            <span class="topbar-gold-pill"><i class="ph-fill ph-coin"></i> <span id="topbar-gold">0</span></span>
            <button id="sound-toggle-btn" class="btn small" aria-label="Attiva/disattiva audio" title="Disattiva audio" onclick="VinylDexSound.toggle()">
              <i class="ph-fill ph-speaker-high"></i>
            </button>
            <button id="btn-signin" class="btn small" onclick="window.location.hash='#login'">Accedi</button>
          </div>
        </header>

        <main id="app-view" class="app-main" role="main" aria-live="polite"></main>

        <footer id="app-footer">
          <div class="footer-inner">
            <small>VinylDex — MVP • Contenuti originali</small>
          </div>
        </footer>
      </div>
    </div>

    <!-- Application scripts -->
    <script src="assets/js/data/artists.js"></script>
    <script src="assets/js/data/packs.js"></script>
    <script src="assets/js/models/Card.js"></script>
    <script src="assets/js/models/Pack.js"></script>
    <script src="assets/js/utils/random.js"></script>
    <script src="assets/js/utils/router.js"></script>
    <script src="assets/js/services/storage.js"></script>
    <script src="assets/js/services/api.js"></script>
    <script src="assets/js/services/generator.js"></script>
    <script src="assets/js/services/sound.js"></script>
    <script src="assets/js/ui/home.js"></script>
    <script src="assets/js/ui/pack-opening.js"></script>
    <script src="assets/js/ui/collection.js"></script>
    <script src="assets/js/ui/vinyl-dex.js"></script>
    <script src="assets/js/ui/missions.js"></script>
    <script src="assets/js/ui/battle.js"></script>
    <script src="assets/js/ui/auth.js"></script>
    <script src="assets/js/ui/debug.js"></script>
    <script src="assets/js/ui/shell.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
